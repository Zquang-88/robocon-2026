[platformio]
default_envs = robot

[env]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags =
    -D USB_SERIAL

; Standalone MAVLink OPTICAL_FLOW_RAD diagnostic firmware.
[env:optical_flow]
build_src_filter =
    +<Read_Optical_Flow.cpp>
    -<communication/>

; Complete Mecanum competition firmware.
[env:robot]
build_src_filter =
    +<main.cpp>
    +<communication/>
    -<Read_Optical_Flow.cpp>
    -<READ_8_LINE_MCP3008.cpp>
    -<READ_TOF_VL53L1X.cpp>
    -<READ_TOF_VL53L3CX.cpp>
lib_deps =
    paulstoffregen/Encoder
    adafruit/Adafruit BNO08x
    playingwithfusion/PWFusion_VL53L3C @ ^1.0.0
extra_scripts =
    pre:tools/patch_pwfusion_wire.py

; Standalone reader/calibrator for the eight center line sensors.
; It only uses SPI0, MCP3008 CS26 and USB Serial; motor pins stay untouched.
[env:line_reader]
build_src_filter =
    -<*>
    +<READ_8_LINE_MCP3008.cpp>

; Standalone four-wheel PID tuner over Teensy USB Serial (for example COM14).
; Only one motor runs at a time and each TEST command automatically times out.
[env:wheel_pid_usb]
build_src_filter =
    -<*>
    +<TUNE_4_WHEELS_USB.cpp>
lib_deps =
    paulstoffregen/Encoder

; Standalone VL53L1X reader on Wire1: SDA17/SCL16, USB Serial 115200.
[env:tof_reader]
build_src_filter =
    -<*>
    +<READ_TOF_VL53L1X.cpp>
lib_deps =
    pololu/VL53L1X

; Standalone DFRobot SEN0378 / VL53L3CX multi-target reader.
; Uses Teensy 4.1 Wire1: SDA17/SCL16 and USB Serial at 115200 baud.
[env:tof_l3cx_reader]
build_src_filter =
    -<*>
    +<READ_TOF_VL53L3CX.cpp>
extra_scripts =
    pre:tools/patch_pwfusion_wire.py
lib_deps =
    playingwithfusion/PWFusion_VL53L3C @ ^1.0.0
