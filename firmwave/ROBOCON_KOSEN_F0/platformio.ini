[platformio]
default_envs = robot

[env]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags =
    -D USB_SERIAL

; Standalone MAVLink OPTICAL_FLOW_RAD diagnostic firmware.
[env:optical_flow]
build_src_filter =
    +<Read_Optical_Flow.cpp>
    -<communication/>
    -<mechanism/>

; Complete Mecanum competition firmware.
[env:robot]
build_src_filter =
    +<main.cpp>
    +<communication/>
    +<mechanism/>
    -<Read_Optical_Flow.cpp>
    -<READ_8_LINE_MCP3008.cpp>
    -<READ_TOF_VL53L1X.cpp>
    -<READ_TOF_VL53L3CX.cpp>
    -<DEBUG_SIDE_HOLD_LINES.cpp>
lib_deps =
    paulstoffregen/Encoder
    adafruit/Adafruit BNO08x
    playingwithfusion/PWFusion_VL53L3C @ ^1.0.0
extra_scripts =
    pre:tools/patch_pwfusion_wire.py

; Standalone commissioning route after the bridge. This build starts directly
; with eight-eye line following, runs through the THA_2A/THA_2B line route, and
; stops as soon as both side sensor clusters have cleared the transverse line.
[env:after_bridge_test]
build_src_filter =
    -<*>
    +<TEST_AFTER_BRIDGE.cpp>
    +<communication/>
    +<mechanism/>
lib_deps =
    paulstoffregen/Encoder
    adafruit/Adafruit BNO08x
    playingwithfusion/PWFusion_VL53L3C @ ^1.0.0
extra_scripts =
    pre:tools/patch_pwfusion_wire.py

; Standalone reader/calibrator for the eight center line sensors.
[env:line_reader]
build_src_filter =
    -<*>
    +<READ_8_LINE_MCP3008.cpp>

; Read-only debugger for both 3-eye side arrays plus H1/H2 on MCP_STOP_CS.
[env:side_hold_line_debug]
build_src_filter =
    -<*>
    +<DEBUG_SIDE_HOLD_LINES.cpp>

; Chassis-only bridge ascent test. Starts directly on the eight-eye guide,
; follows it at 1150 mm/s, logs CH0..CH7 drop/found events, and stops at crest.
[env:bridge_line_1150_test]
build_src_filter =
    -<*>
    +<TEST_BRIDGE_LINE_1150.cpp>
    +<communication/>
    +<mechanism/>
lib_deps =
    paulstoffregen/Encoder
    adafruit/Adafruit BNO08x
    playingwithfusion/PWFusion_VL53L3C @ ^1.0.0
extra_scripts =
    pre:tools/patch_pwfusion_wire.py

; Standalone four-wheel PID tuner over Teensy USB Serial.
[env:wheel_pid_usb]
build_src_filter =
    -<*>
    +<TUNE_4_WHEELS_USB.cpp>
lib_deps =
    paulstoffregen/Encoder

; Standalone VL53L1X reader on Wire1.
[env:tof_reader]
build_src_filter =
    -<*>
    +<READ_TOF_VL53L1X.cpp>
lib_deps =
    pololu/VL53L1X

; Standalone DFRobot SEN0378 / VL53L3CX multi-target reader.
[env:tof_l3cx_reader]
build_src_filter =
    -<*>
    +<READ_TOF_VL53L3CX.cpp>
extra_scripts =
    pre:tools/patch_pwfusion_wire.py
lib_deps =
    playingwithfusion/PWFusion_VL53L3C @ ^1.0.0
